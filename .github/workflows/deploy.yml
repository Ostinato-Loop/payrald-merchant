name: Deploy payrald-merchant

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --no-frozen-lockfile 2>/dev/null || npm install 2>/dev/null || echo "No package manager"
      - name: Provision CF Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf '%s' "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name payrald-merchant || true
          printf '%s' "${{ secrets.RALD_JWT_SECRET }}"           | npx wrangler secret put RALD_JWT_SECRET            --name payrald-merchant || true
          printf '%s' "${{ secrets.MACHINE_IDENTITY_SECRET }}"   | npx wrangler secret put MACHINE_IDENTITY_SECRET    --name payrald-merchant || true
          printf '%s' "${{ secrets.SESSION_SECRET }}"            | npx wrangler secret put SESSION_SECRET             --name payrald-merchant || true
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy 2>/dev/null || echo "No wrangler.toml yet — worker not deployed"
